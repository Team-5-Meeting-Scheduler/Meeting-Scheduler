[project]
name = "meeting-scheduler"
version = "0.1.0"
description = "Find a meeting time that works across participant calendars."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["icalendar>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
meeting-scheduler = "scheduler.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scheduler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
